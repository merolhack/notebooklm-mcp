name: NotebookLM Session Heartbeat (Free Public Runner)

on:
  schedule:
    # Mantiene viva la sesion cada 12h sin consumir minutos de repositorios privados
    - cron: '17 */12 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  heartbeat:
    name: Refresh NotebookLM Auth State Headless
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check NOTEBOOKLM_AUTH_JSON secret
        id: check
        env:
          AUTH_JSON: ${{ secrets.NOTEBOOKLM_AUTH_JSON }}
        run: |
          if [ -z "$AUTH_JSON" ]; then
            echo "::notice::NOTEBOOKLM_AUTH_JSON secret is not configured yet. Run: gh secret set NOTEBOOKLM_AUTH_JSON -R merolhack/notebooklm-mcp < state.json"
            echo "has_secret=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_secret=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js 22
        if: steps.check.outputs.has_secret == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright Chromium & Hydrate State
        if: steps.check.outputs.has_secret == 'true'
        env:
          AUTH_JSON: ${{ secrets.NOTEBOOKLM_AUTH_JSON }}
        run: |
          mkdir -p "$HOME/.local/share/notebooklm-mcp/browser_state"
          printf '%s' "$AUTH_JSON" > "$HOME/.local/share/notebooklm-mcp/browser_state/state.json"
          chmod 600 "$HOME/.local/share/notebooklm-mcp/browser_state/state.json"
          npm install --no-save playwright
          npx playwright install chromium

      - name: Run Headless NotebookLM Heartbeat
        if: steps.check.outputs.has_secret == 'true'
        run: |
          node - <<'JS'
          const fs = require('fs');
          const { chromium } = require('playwright');
          (async () => {
            const state = JSON.parse(fs.readFileSync(process.env.HOME + '/.local/share/notebooklm-mcp/browser_state/state.json', 'utf8'));
            const browser = await chromium.launch({ headless: true });
            const ctx = await browser.newContext({ storageState: state });
            const page = await ctx.newPage();
            await page.goto('https://notebooklm.google.com/notebook/542e548d-7cdb-4abd-8fdd-1f7f33b70aa0', { waitUntil: 'domcontentloaded', timeout: 30000 });
            await page.waitForTimeout(4000);
            const url = page.url();
            const expired = url.includes('accounts.google.com');
            console.log('Heartbeat status:', expired ? 'SESSION_EXPIRED' : 'AUTHENTICATED_OK');
            await browser.close();
            if (expired) {
              console.log('::warning::NotebookLM session expired; refresh local state.json and update NOTEBOOKLM_AUTH_JSON secret.');
            }
          })();
          JS
